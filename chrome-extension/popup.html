<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲鱼Cookie获取助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 320px; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .container { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; }
        .header p { font-size: 12px; color: #666; }
        .status { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.info { background: #dbeafe; color: #1e40af; }
        .status .icon { font-size: 24px; margin-bottom: 8px; }
        .cookie-content { background: #f8f9fa; border-radius: 8px; padding: 12px; max-height: 150px; overflow-y: auto; margin-bottom: 16px; font-family: monospace; font-size: 11px; color: #333; word-break: break-all; white-space: pre-wrap; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f3f4f6; color: #374151; margin-top: 8px; }
        .btn-secondary:hover { background: #e5e7eb; }
        .hidden { display: none; }
        .copied { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
        .copied.show { opacity: 1; }
        .step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; color: #555; }
        .step .num { width: 24px; height: 24px; background: #667eea; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
        .tips { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 10px; border-radius: 0 8px 8px 0; margin-top: 16px; font-size: 12px; color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 闲鱼Cookie获取助手</h1>
            <p>一键获取Cookie，轻松配置自动回复</p>
        </div>
        
        <div id="status-info" class="status info">
            <div class="icon">📋</div>
            <div>请先打开闲鱼网站并登录</div>
        </div>
        
        <div id="cookie-section" class="hidden">
            <div id="cookie-content" class="cookie-content"></div>
            <button id="copy-btn" class="btn btn-primary">复制Cookie</button>
            <button id="open-config-btn" class="btn btn-secondary">🌐 打开配置页面</button>
            <button id="refresh-btn" class="btn btn-secondary">🔄 刷新Cookie</button>
        </div>
        
        <div id="steps" class="hidden">
            <div class="step"><div class="num">1</div><span>打开闲鱼网站</span></div>
            <div class="step"><div class="num">2</div><span>登录您的账号</span></div>
            <div class="step"><div class="num">3</div><span>点击下方按钮获取Cookie</span></div>
        </div>
        
        <button id="get-cookie-btn" class="btn btn-primary">获取Cookie</button>
        
        <div class="tips">
            <strong>💡 提示：</strong>获取的Cookie将自动复制到剪贴板，直接粘贴到配置页面即可使用。
        </div>
    </div>
    
    <div id="copied-toast" class="copied">✓ 已复制到剪贴板</div>
    
    <script src="popup.js"></script>
</body>
</html>
